  <text x="24" y="114" font-size="16" class="orange" xml:space="preserve">███████║██║   ██║██║ █╗ ██║██║  ██║ ╚████╔╝ ██║</text>
  <text x="24" y="132" font-size="16" class="orange" xml:space="preserve">██╔══██║██║   ██║██║███╗██║██║  ██║  ╚██╔╝  ╚═╝</text>
